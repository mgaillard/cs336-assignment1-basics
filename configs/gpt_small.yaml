# Example training configuration for TransformerLM
model:
  vocab_size: 50257
  num_layers: 4
  d_model: 512
  num_heads: 16
  d_ff: 1344
  eps: 0.00001
  max_seq_len: 256
  theta: 10000

optim:
  lr: 0.0003
  weight_decay: 0.01

trainer:
  device: cuda
  max_steps: 1000
  save_interval: 100
  log_interval: 50
  val_interval: 100

data:
  batch_size: 8
  val_batch_size: 32
  context_length: 256
  # Uncomment and set paths when using real data:
  train_path: data/TinyStoriesV2-GPT4-valid-tokens.npy
  validation_path: data/TinyStoriesV2-GPT4-valid-tokens.npy
