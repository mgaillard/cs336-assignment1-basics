# Full training configuration for TransformerLM on TinyStoriesV2
defaults:
  - base_config  # attach the structured-config schema (registered via ConfigStore) for validation
  - override hydra/job_logging: tqdm  # tqdm-safe console handler + per-run file log
  - _self_       # this file's values override the schema defaults

######################################
# Component                Parameters
# -----------------------------------
# embedding                16,384,000
# block_0                   3,113,984
# block_1                   3,113,984
# block_2                   3,113,984
# block_3                   3,113,984
# final_norm                      512
# output_proj              16,384,000
# -----------------------------------
# total                    28,840,448
######################################

model:
  vocab_size: 32000
  num_layers: 4
  d_model: 512
  num_heads: 16
  d_ff: 1344
  eps: 0.00001
  max_seq_len: 256
  theta: 10000
  use_pytorch_sdpa: true
  tie_embeddings: true

optim:
  lr: 0.000707
  weight_decay: 0.01
  max_grad_norm: 1.0

scheduler:
  # 1% of the total training steps for warmup
  warmup_steps: 350
  T_max: 35000
  # Coupled to the learning rate (eta_min = lr / 10).
  # Resolves to 3e-5 at the default lr=3e-4.
  eta_min: "${mul:${optim.lr},0.1}"

trainer:
  device: cuda
  dtype: bfloat16
  compile: true
  # Save checkpoints into this run's Hydra output directory so concurrent --multirun jobs (and
  # successive runs) don't overwrite each other. Resolves to e.g. outputs/<date>/<time> or, under
  # --multirun, multirun/<date>/<time>/<job>. The dir already exists (Hydra creates it).
  save_dir: ${hydra:runtime.output_dir}
  # Uses batch size and learning rate in the path for easy identification.
  tensorboard_log_dir: logs/bs_${data.batch_size}_lr_${optim.lr}
  # Recommended to set max_steps to a value that makes (context length * batch size * max_steps) approximately 585,416,899
  max_steps: 35000
  save_interval: 5000
  log_interval: 175
  val_interval: 350

data:
  # The optimal batch size is determined by scaling experiments
  batch_size: 64
  # Validation batch size is about 1M tokens
  val_batch_size: 4096
  # Maximum batch size per GPU, this depends on the available GPU memory
  max_batch_size_per_gpu: 16
  context_length: 256
  # Uncomment and set paths when using real data:
  train_path: data/TinyStoriesV2-GPT4-train-tokens.npy
  validation_path: data/TinyStoriesV2-GPT4-valid-tokens.npy
