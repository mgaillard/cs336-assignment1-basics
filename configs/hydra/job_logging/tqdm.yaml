# Custom Hydra job-logging config: tqdm-compatible console handler + a per-run file log.
# The console handler uses cs336_basics.logger.TqdmLoggingHandler so log records are emitted via
# tqdm.write() and don't clobber progress bars. Selected via `override hydra/job_logging: tqdm`.
version: 1
formatters:
  simple:
    format: "[%(asctime)s] [%(levelname)s]: %(message)s"
handlers:
  console:
    class: cs336_basics.logger.TqdmLoggingHandler
    formatter: simple
  file:
    class: logging.FileHandler
    formatter: simple
    filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
root:
  level: INFO
  handlers: [console, file]
disable_existing_loggers: false
