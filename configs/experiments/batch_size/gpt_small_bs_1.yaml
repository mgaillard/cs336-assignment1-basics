extends: ../../gpt_small.yaml

scheduler:
  warmup_steps: 200
  T_max: 160000

trainer:
  # Recommended to set max_steps to a value that makes (context length * batch size * max_steps) approximately 40,000,000
  max_steps: 160000
  save_interval: 1000
  log_interval: 800
  val_interval: 1600

data:
  num_batch: 1
  batch_size: 1
