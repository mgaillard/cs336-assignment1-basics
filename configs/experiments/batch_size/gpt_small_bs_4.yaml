extends: ../../gpt_small.yaml

scheduler:
  warmup_steps: 200
  T_max: 40000

trainer:
  # Recommended to set max_steps to a value that makes (context length * batch size * max_steps) approximately 40,000,000
  max_steps: 40000
  save_interval: 1000
  log_interval: 200
  val_interval: 400

data:
  num_batch: 1
  batch_size: 4
