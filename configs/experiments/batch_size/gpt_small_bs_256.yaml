extends: ../../gpt_small.yaml

scheduler:
  warmup_steps: 200
  T_max: 600

trainer:
  # Recommended to set max_steps to a value that makes (context length * batch size * max_steps) approximately 40,000,000
  max_steps: 600
  save_interval: 1000
  log_interval: 3
  val_interval: 6

data:
  num_batch: 32
  batch_size: 8
